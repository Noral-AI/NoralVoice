[project]
name = "dograh-sdk"
version = "0.2.0"
description = "Deprecated alias of noralai-voice. Install `noralai-voice` instead."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Noral AI", email = "support@noral.ai" },
]
keywords = ["deprecated", "noralvoice", "dograh"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "noralai-voice==0.2.0",
]

[project.urls]
Homepage = "https://noral.ai"
Repository = "https://github.com/Noral-AI/NoralVoice"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dograh_sdk"]
