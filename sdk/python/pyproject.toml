[project]
name = "noralai-voice"
version = "0.3.0"
description = "Typed builder for NoralVoice voice-AI workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Noral AI", email = "support@noral.ai" },
]
keywords = ["noralvoice", "voice-ai", "workflow", "sdk", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://noral.ai"
Documentation = "https://docs.noral.ai/voice"
Repository = "https://github.com/Noral-AI/NoralVoice"

[project.scripts]
noralai-voice-codegen = "noralai_voice.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noralai_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
